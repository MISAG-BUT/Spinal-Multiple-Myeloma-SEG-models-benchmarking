[project]
name = "spinal-mm-analyses"
version = "0.1.0"
description = "Analysis code and results for multi-channel dual-energy CT segmentation of spinal multiple myeloma lesions"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "scipy>=1.17",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Only needed for training / inference / evaluation (see environment/README.md for the CUDA-specific torch install)
nnunet = [
    "torch>=2.6",
    "nnunetv2==2.6.4",
]
